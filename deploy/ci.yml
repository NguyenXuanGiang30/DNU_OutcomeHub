name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    name: Build & Test on PostgreSQL 18
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore OutcomeHub.slnx

      - name: Build Solution
        run: dotnet build OutcomeHub.slnx --no-restore --configuration Release

      - name: Run Integration Tests with Testcontainers
        run: dotnet test OutcomeHub.slnx --no-build --configuration Release --verbosity normal

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/OutcomeHub.Api/Dockerfile
          push: false
          tags: outcomehub-api:latest
